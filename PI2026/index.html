<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pavil | Carregando...</title>
    <link rel="icon" type="image/x-icon" href="imagens/pavil logo.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #030a16;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container Principal com o fundo azul escuro texturizado/místico */
        .splash-container {
            position: relative;
            width: 100%;
            height: 100vh;
            background: radial-gradient(circle, #0a1e3f 0%, #030a16 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* Brilho místico de fundo */
        .mystic-orb {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(0, 114, 181, 0.2);
            border-radius: 50%;
            filter: blur(50px);
            animation: pulseOrb 4s infinite alternate;
        }

        .splash-content {
            z-index: 2;
        }

        /* --- OLHO GREGO ESTILIZADO --- */
        .evil-eye {
            margin-bottom: 30px;
            animation: float 3s ease-in-out infinite;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .eye-outer {
            width: 140px;
            height: 140px;
            background-color: #004b93;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px rgba(0, 75, 147, 0.6);
        }

        .eye-white {
            width: 100px;
            height: 100px;
            background-color: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: rotate(45deg);
        }

        .eye-blue {
            width: 55px;
            height: 55px;
            background: radial-gradient(circle, #00a4e4 0%, #005c9e 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .eye-pupil {
            width: 25px;
            height: 25px;
            background-color: #050b14;
            border-radius: 50%;
            box-shadow: inset -2px -2px 5px rgba(255, 255, 255, 0.4);
        }

        /* --- TEXTOS (Tipografia Cinzel para o ar mítico) --- */
        .splash-title {
            font-family: 'Cinzel', serif;
            color: #d4af37;
            font-size: 2.5rem;
            letter-spacing: 7px;
            margin-bottom: 5px;
            text-shadow: 0 2px 10px rgba(212, 175, 55, 0.3);
        }

        .splash-subtitle {
            font-family: 'Cinzel', serif;
            color: #ffffff;
            font-size: 1.5rem;
            letter-spacing: 5px;
            opacity: 0.9;
            margin-bottom: 30px;
        }

        /* --- LOADER EM CÍRCULO DE PONTOS (Duração ajustada para 5s) --- */
        .spinner-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin: 0 auto;
        }

        .spinner-dots {
            position: relative;
            width: 50px;
            height: 50px;
            animation: spin 5s linear infinite;
        }

        .spinner-dots div {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #d4af37;
            transform-origin: 25px 25px;
        }

        /* Posicionamento e opacidade gradual dos 8 pontos em tom dourado */
        .spinner-dots div:nth-child(1) { transform: rotate(0deg) translate(18px); opacity: 1; }
        .spinner-dots div:nth-child(2) { transform: rotate(45deg) translate(18px); opacity: 0.85; }
        .spinner-dots div:nth-child(3) { transform: rotate(90deg) translate(18px); opacity: 0.7; }
        .spinner-dots div:nth-child(4) { transform: rotate(135deg) translate(18px); opacity: 0.55; }
        .spinner-dots div:nth-child(5) { transform: rotate(180deg) translate(18px); opacity: 0.4; }
        .spinner-dots div:nth-child(6) { transform: rotate(225deg) translate(18px); opacity: 0.28; }
        .spinner-dots div:nth-child(7) { transform: rotate(270deg) translate(18px); opacity: 0.18; }
        .spinner-dots div:nth-child(8) { transform: rotate(315deg) translate(18px); opacity: 0.1; }

        /* --- BARRA DE PROGRESSO ABAIXO (Duração ajustada para 5s) --- */
        .loading-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .loading-text {
            font-family: 'Cinzel', serif;
            color: #d4af37;
            font-size: 0.85rem;
            letter-spacing: 3px;
        }

        .loading-bar-track {
            width: 160px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .loading-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #997d22, #d4af37);
            border-radius: 3px;
            animation: progressAnimation 5s ease-in-out infinite alternate;
        }

        /* --- ANIMAÇÕES --- */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        @keyframes pulseOrb {
            0% { transform: scale(1); opacity: 0.2; }
            100% { transform: scale(1.2); opacity: 0.4; }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes progressAnimation {
            0% { width: 10%; }
            50% { width: 75%; }
            100% { width: 95%; }
        }
    </style>

    <script src="index.js" defer></script>
</head>
<body>

    <div class="splash-container">
        <div class="mystic-orb"></div>
        
        <div class="splash-content">
            <div class="evil-eye">
                <div class="eye-outer">
                    <div class="eye-white">
                        <div class="eye-blue">
                            <div class="eye-pupil"></div>
                        </div>
                    </div>
                </div>
            </div>

            <h1 class="splash-title">PROTEÇÃO</h1>
            <p class="splash-subtitle">E SORTE</p>

            <!-- Spinner em pontos dourados + Barra de carregamento (5 segundos cada) -->
            <div class="spinner-container">
                <div class="spinner-dots">
                    <div></div><div></div><div></div><div></div>
                    <div></div><div></div><div></div><div></div>
                </div>
                
                <div class="loading-box">
                    <span class="loading-text">CARREGANDO...</span>
                    <div class="loading-bar-track">
                        <div class="loading-bar-fill"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
