<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pavil | Meu Perfil</title>
    <link rel="icon" type="image/x-icon" href="imagens/pavil logo.png">
    <!-- Font Awesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-deep: #0a0e17;
            --blue-greek: #0056b3;
            --blue-light: #00a8ff;
            --gold: #dfb76c;
            --text-light: #f5f6fa;
            --card-bg: rgba(15, 23, 42, 0.6);
            --green-karma: #00b894;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(0, 86, 179, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(223, 183, 108, 0.03) 0%, transparent 40%);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(223, 183, 108, 0.15);
            border-radius: 28px;
            padding: 50px 30px 40px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
        }

        /* Botão de Seta Superior (Voltar) */
        .btn-back {
            position: absolute;
            top: 24px;
            left: 24px;
            color: var(--gold);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            opacity: 0.8;
        }

        .btn-back:hover {
            opacity: 1;
            transform: translateX(-3px);
        }

        .btn-back svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
        }

        /* Avatar com Olho Grego Protetor */
        .profile-header {
            position: relative;
            margin-bottom: 24px;
            display: inline-block;
        }

        .avatar-container {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            padding: 4px;
            background: rgba(10, 14, 23, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(223, 183, 108, 0.2);
            cursor: pointer;
            transition: transform 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .avatar-container:hover {
            transform: scale(1.04);
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background: #1e293b;
        }

        .greek-eye-badge {
            position: absolute;
            bottom: -5px;
            right: -5px;
            width: 36px;
            height: 36px;
            background: var(--bg-deep);
            border: 1.5px solid var(--gold);
            border-radius: 50%;
            padding: 4px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            animation: pulse 3s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); box-shadow: 0 4px 15px rgba(0, 168, 255, 0.4); }
        }

        /* Container do Nome + Ícone de Editar */
        .profile-name-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--text-light);
            word-wrap: break-word;
        }

        .btn-edit-name {
            background: transparent;
            border: none;
            color: var(--gold);
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            opacity: 0.7;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .btn-edit-name:hover {
            opacity: 1;
            color: var(--blue-light);
            transform: scale(1.15);
        }

        p.user-status {
            font-size: 0.9rem;
            color: var(--gold);
            letter-spacing: 1px;
            margin-top: 6px;
            margin-bottom: 28px;
            word-wrap: break-word;
            padding: 0 10px;
            line-height: 1.3;
        }

        /* Status de Energia / Karma */
        .karma-meter {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 28px;
            text-align: left;
        }

        .karma-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .karma-title {
            font-size: 0.85rem;
            color: #8a99ad;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .karma-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--green-karma);
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 78%;
            height: 100%;
            background: linear-gradient(90deg, var(--blue-greek), var(--green-karma));
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0, 184, 148, 0.4);
        }

        /* Lista de Histórico / Ações Cósmicas */
        .activity-section {
            text-align: left;
            margin-bottom: 32px;
        }

        .activity-section h2 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #8a99ad;
            margin-bottom: 16px;
            font-weight: 500;
        }

        .activity-list {
            display: flex;
            gap: 12px;
            flex-direction: column;
        }

        .activity-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.01);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding: 12px 4px;
            font-size: 0.9rem;
        }

        .activity-desc {
            color: #d1d8e0;
        }

        .activity-impact {
            font-size: 0.85rem;
            font-weight: 500;
        }

        .activity-impact.positive { color: var(--green-karma); }
        .activity-impact.neutral { color: var(--gold); }

        /* Ações do Perfil */
        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        .btn-action {
            padding: 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: var(--text-light);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
        }

        .btn-action:hover {
            background: rgba(0, 86, 179, 0.15);
            border-color: var(--blue-light);
            color: #fff;
        }

        .btn-logout {
            width: 100%;
            padding: 14px;
            background: transparent;
            border: 1px solid rgba(235, 94, 94, 0.2);
            border-radius: 12px;
            color: #eb5e5e;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .btn-logout:hover {
            background: rgba(235, 94, 94, 0.1);
            border-color: #eb5e5e;
        }

        /* MODAIS */
        .karma-modal {
            display: none;
            position: fixed;
            z-index: 2000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(10, 14, 23, 0.9);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .karma-modal.aberto {
            display: flex;
            opacity: 1;
        }

        .modal-container {
            position: relative;
            max-width: 90%;
            max-height: 85vh;
            text-align: center;
            background: #141b36;
            padding: 25px;
            border-radius: 20px;
            border: 2px solid var(--gold);
            box-shadow: 0 0 30px rgba(0, 168, 255, 0.3);
        }

        .modal-foto-ampliada {
            width: 100%;
            max-width: 350px;
            max-height: 70vh;
            border-radius: 15px;
            object-fit: contain;
            border: 1px solid var(--gold);
        }

        .cropper-preview-box {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 3px solid var(--gold);
            overflow: hidden;
            margin: 0 auto 20px auto;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #imagemParaCortar {
            max-width: none;
            cursor: grab;
            position: absolute;
            transform-origin: center;
        }

        .editor-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .editor-controls label {
            font-size: 0.85rem;
            color: var(--gold);
            text-align: left;
        }

        .editor-controls input[type="range"] {
            width: 100%;
            accent-color: var(--blue-light);
            cursor: pointer;
        }

        .btn-salvar-foto {
            background: var(--blue-greek);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-salvar-foto:hover {
            background: var(--blue-light);
        }

        .fechar-modal {
            position: absolute;
            top: 10px;
            right: 15px;
            color: var(--gold);
            font-size: 30px;
            cursor: pointer;
            user-select: none;
        }

        .fechar-modal:hover {
            color: var(--blue-light);
        }
    </style>

    <script src="aleatorio.js" defer></script>
    <script src="cadastro.js" defer></script>
</head>
<body>

    <div class="container">
        <div class="card">
            
            <a href="interface.html" class="btn-back" title="Voltar ao Início">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </a>
            
            <!-- Avatar -->
            <div class="profile-header" id="triggerFoto" title="1 clique: Ampliar | 2 cliques: Alterar foto">
                <div class="avatar-container">
                    <img src="imagens/arthur cervero.jpg" alt="Avatar do Usuário" id="fotoOriginal">
                </div>
                <svg class="greek-eye-badge" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10 50C25 25 75 25 90 50C75 75 25 75 10 50Z" stroke="#dfb76c" stroke-width="4"/>
                    <circle cx="50" cy="50" r="22" fill="#0056b3"/>
                    <circle cx="50" cy="50" r="12" fill="#00a8ff"/>
                    <circle cx="50" cy="50" r="5" fill="#0a0e17"/>
                </svg>
            </div>

            <!-- Input invisível para buscar arquivos -->
            <input type="file" id="inputArquivoFoto" accept="image/*" style="display: none;">

            <!-- Nome do Perfil + Ícone de Lápis -->
            <div class="profile-name-wrapper">
                <h1 id="nome-perfil">ks</h1>
                <button class="btn-edit-name" id="btnEditarNome" title="Editar nome">
                    <i class="fa-solid fa-pen"></i>
                </button>
            </div>
            
            <p class="user-status" id="nome-completo-status"></p>

            <div class="karma-meter">
                <div class="karma-info">
                    <span class="karma-title">Exposição Paranormal</span>
                    <span class="karma-value">+780</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill"></div>
                </div>
            </div>

            <div class="activity-section">
                <h2>Ações Recentes e Retorno</h2>
                <div class="activity-list">
                    <div class="activity-item">
                        <span class="activity-desc">Meditação Concluída</span>
                        <span class="activity-impact positive">+50 Karma</span>
                    </div>
                    <div class="activity-item">
                        <span class="activity-desc">Ação Altruísta Registrada</span>
                        <span class="activity-impact positive">+120 Karma</span>
                    </div>
                    <div class="activity-item">
                        <span class="activity-desc">Leitura do Oráculo Diário</span>
                        <span class="activity-impact neutral">Neutro</span>
                    </div>
                </div>
            </div>

            <div class="actions-grid">
                <button class="btn-action">Lista dos Desejos 🔮</button>
                <a href="config.html" class="btn-action">Configurações</a>
                
            </div>

            <a href="login.html" class="btn-logout">Desconectar do Centro</a>

        </div>
    </div>

    <!-- MODAL 1: VISUALIZAR FOTO AMPLIADA (1 CLIQUE) -->
    <div class="karma-modal" id="modalVisualizador">
        <div class="modal-container">
            <span class="fechar-modal" id="btnFecharVisualizador">&times;</span>
            <h3 style="color: var(--text-light); margin-bottom: 15px; font-family: 'Cinzel', serif;"></h3>
            <img class="modal-foto-ampliada" id="fotoAmpliadaModal" src="" alt="Foto Ampliada">
        </div>
    </div>

    <!-- MODAL 2: EDITOR / CORTADOR DE FOTO (2 CLIQUES) -->
    <div class="karma-modal" id="modalEditorFoto">
        <div class="modal-container">
            <span class="fechar-modal" id="btnFecharEditor">&times;</span>
            <h3 style="color: var(--text-light); margin-bottom: 15px; font-family: 'Cinzel', serif;">Ajustar Nova Foto</h3>
            
            <div class="cropper-preview-box" id="previewBox">
                <img id="imagemParaCortar" alt="Ajustar Imagem">
            </div>

            <div class="editor-controls">
                <label for="zoomRange">Zoom / Escala:</label>
                <input type="range" id="zoomRange" min="0.5" max="3" step="0.05" value="1">
            </div>

            <button class="btn-salvar-foto" id="btnSalvarFotoRecortada">Aplicar Nova Foto</button>
        </div>
    </div>

    <!-- SCRIPT DE CONTROLE -->
    <script>

        function redirecionar() {
    // Altere 'nova-pagina.html' para o destino desejado
    window.location.href = 'config.html';
}

        function aplicarDadosDoPerfil() {
            const elementoH1 = document.getElementById('nome-perfil');
            const elementoStatus = document.getElementById('nome-completo-status');
            const fotoOriginal = document.getElementById('fotoOriginal');

            const nomeCompleto = localStorage.getItem('nomeCompleto') || localStorage.getItem('nameInput');
            if (nomeCompleto && elementoStatus) {
                elementoStatus.textContent = nomeCompleto;
            }

            const nomeUsuario = localStorage.getItem('nomeUsuario') || localStorage.getItem('usernameInput');
            if (nomeUsuario && elementoH1) {
                elementoH1.textContent = nomeUsuario;
            }

            const fotoSalva = localStorage.getItem('fotoPerfilUsuario');
            if (fotoSalva && fotoOriginal) {
                fotoOriginal.src = fotoSalva;
            }
        }

        window.addEventListener('load', () => {
            aplicarDadosDoPerfil();

            const intervalo = setInterval(aplicarDadosDoPerfil, 100);
            setTimeout(() => clearInterval(intervalo), 1200);

            // Edição de nome
            const btnEditar = document.getElementById('btnEditarNome');
            const elementoH1 = document.getElementById('nome-perfil');
            if (btnEditar && elementoH1) {
                btnEditar.onclick = () => {
                    const novoNome = prompt("Digite o novo nome de utilizador:", elementoH1.textContent);
                    if (novoNome && novoNome.trim() !== "") {
                        const nomeLimpo = novoNome.trim();
                        elementoH1.textContent = nomeLimpo;
                        localStorage.setItem('nomeUsuario', nomeLimpo);
                    }
                };
            }

            // Variáveis e Lógica de 1 Clique vs 2 Cliques
            const triggerFoto = document.getElementById('triggerFoto');
            const fotoOriginal = document.getElementById('fotoOriginal');
            const modalVisualizador = document.getElementById('modalVisualizador');
            const fotoAmpliadaModal = document.getElementById('fotoAmpliadaModal');
            const btnFecharVisualizador = document.getElementById('btnFecharVisualizador');

            const inputArquivoFoto = document.getElementById('inputArquivoFoto');
            const modalEditor = document.getElementById('modalEditorFoto');
            const btnFecharEditor = document.getElementById('btnFecharEditor');
            const imagemParaCortar = document.getElementById('imagemParaCortar');
            const zoomRange = document.getElementById('zoomRange');
            const btnSalvarFotoRecortada = document.getElementById('btnSalvarFotoRecortada');

            let temporizadorClique = null;

            // 1 CLIQUE: Abre modal para ver a foto maior
            triggerFoto.addEventListener('click', (e) => {
                clearTimeout(temporizadorClique);
                temporizadorClique = setTimeout(() => {
                    fotoAmpliadaModal.src = fotoOriginal.src;
                    modalVisualizador.classList.add('aberto');
                }, 250); // Aguarda para garantir que não foi um clique duplo
            });

            // 2 CLIQUES (Duplo clique): Abre o explorador de ficheiros para trocar a foto
            triggerFoto.addEventListener('dblclick', (e) => {
                clearTimeout(temporizadorClique); // Cancela o evento de 1 clique
                inputArquivoFoto.click();
            });

            // Fechar modal de visualização
            if (btnFecharVisualizador && modalVisualizador) {
                btnFecharVisualizador.addEventListener('click', () => {
                    modalVisualizador.classList.remove('aberto');
                });
            }

            // Quando seleciona imagem no explorador
            if (inputArquivoFoto) {
                inputArquivoFoto.addEventListener('change', (e) => {
                    const ficheiro = e.target.files[0];
                    if (ficheiro) {
                        const leitor = new FileReader();
                        leitor.onload = function(event) {
                            imagemParaCortar.src = event.target.result;
                            modalEditor.classList.add('aberto');
                            zoomRange.value = 1;
                            imagemParaCortar.style.transform = `translate(0px, 0px) scale(1)`;
                        }
                        leitor.readAsDataURL(ficheiro);
                    }
                });
            }

            if (btnFecharEditor && modalEditor) {
                btnFecharEditor.addEventListener('click', () => {
                    modalEditor.classList.remove('aberto');
                    inputArquivoFoto.value = "";
                });
            }

            // Lógica de arrastar e dar zoom na edição
            let posX = 0, posY = 0, arrastando = false, inicioX = 0, inicioY = 0;

            if (imagemParaCortar && zoomRange) {
                zoomRange.addEventListener('input', () => {
                    atualizarTransformacao(zoomRange.value);
                });

                imagemParaCortar.addEventListener('mousedown', iniciarArraste);
                imagemParaCortar.addEventListener('touchstart', iniciarArraste);

                function iniciarArraste(e) {
                    arrastando = true;
                    inicioX = (e.clientX || e.touches[0].clientX) - posX;
                    inicioY = (e.clientY || e.touches[0].clientY) - posY;
                    e.preventDefault();
                }

                window.addEventListener('mousemove', emArraste);
                window.addEventListener('touchmove', emArraste);

                function emArraste(e) {
                    if (!arrastando) return;
                    posX = (e.clientX || e.touches[0].clientX) - inicioX;
                    posY = (e.clientY || e.touches[0].clientY) - inicioY;
                    atualizarTransformacao(zoomRange.value);
                }

                window.addEventListener('mouseup', () => arrastando = false);
                window.addEventListener('touchend', () => arrastando = false);

                function atualizarTransformacao(escala) {
                    imagemParaCortar.style.transform = `translate(${posX}px, ${posY}px) scale(${escala})`;
                }
            }

            // Salvar a nova foto recortada
            if (btnSalvarFotoRecortada) {
                btnSalvarFotoRecortada.addEventListener('click', () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = 300;
                    canvas.height = 300;
                    const ctx = canvas.getContext('2d');

                    const img = new Image();
                    img.src = imagemParaCortar.src;
                    img.onload = function() {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.save();
                        ctx.translate(canvas.width / 2, canvas.height / 2);
                        ctx.translate(posX, posY);
                        ctx.scale(zoomRange.value, zoomRange.value);
                        ctx.drawImage(img, -img.width / 2, -img.height / 2);
                        ctx.restore();

                        const novaBase64 = canvas.toDataURL('image/png');
                        if (fotoOriginal) {
                            fotoOriginal.src = novaBase64;
                        }
                        localStorage.setItem('fotoPerfilUsuario', novaBase64);

                        modalEditor.classList.remove('aberto');
                        inputArquivoFoto.value = "";
                    }
                });
            }
        });
    </script>

</body>
</html>
