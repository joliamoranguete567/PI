<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pavil | Configurações</title>
    <link rel="icon" type="image/x-icon" href="imagens/pavil logo.png">
    <!-- Font Awesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts estilo Místico -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Quicksand:wght@400;600&display=swap">
    <style>
        /* ========================================================
           VARIÁVEIS DE CORES E ESTILO (Altere aqui para mudar o tema)
           ======================================================== */
        :root {
            /* Estética Olho Grego & Mística */
            --bg-color: #0b1021;              /* Azul escuro profundo / Noite */
            --card-bg: #141b36;               /* Azul místico para os cards */
            --card-hover-bg: #1c264a;         /* Cor ao passar o mouse */
            --text-color: #f0f4f8;            /* Texto claro */
            --text-secondary: #9bb1d4;       /* Texto secundário/subtítulo */
            --accent-blue: #0088ff;           /* Azul vibrante do Olho Grego */
            --accent-cyan: #00e5ff;           /* Ciano mágico */
            --accent-gold: #e2b755;           /* Dourado místico principal */
            --accent-gold-light: #fff2a8;     /* Dourado claro para brilho */
            --border-glow: rgba(0, 229, 255, 0.3); /* Brilho suave */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Quicksand', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
            /* Fundo com detalhes sutis de estrelas/névoa */
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(0, 136, 255, 0.15), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(226, 183, 85, 0.08), transparent 30%);
        }

        .container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* ==================== SEÇÃO CABEÇALHO ==================== */
        .header-section {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 10px 5px;
        }

        .back-link {
            color: var(--accent-gold);
            font-size: 1.5rem;
            text-decoration: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(226, 183, 85, 0.1);
            border: 1px solid rgba(226, 183, 85, 0.3);
        }

        .back-link:hover {
            color: var(--accent-cyan);
            transform: translateX(-4px) scale(1.05);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
            border-color: var(--accent-cyan);
        }

        .header-title-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Ícone de Olho Grego Místico em SVG/CSS */
        .greek-eye-icon {
            position: relative;
            width: 32px;
            height: 32px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 12px var(--accent-cyan);
            border: 2px solid var(--accent-gold);
        }

        .greek-eye-icon::before {
            content: '';
            width: 20px;
            height: 20px;
            background: var(--accent-cyan);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
        }

        .greek-eye-icon::after {
            content: '';
            width: 10px;
            height: 10px;
            background: var(--bg-color);
            border-radius: 50%;
            position: absolute;
        }

        .header-title-wrapper h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            /* Cor Dourada Puro/Metálico Místico */
            color: var(--accent-gold);
            background: linear-gradient(135deg, var(--accent-gold-light) 0%, var(--accent-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(226, 183, 85, 0.3);
        }

        /* ==================== CARDS DE CONFIGURAÇÃO ==================== */
        .option-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            padding: 25px 30px;
            display: flex;
            align-items: center;
            gap: 25px;
            text-decoration: none;
            color: inherit;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        /* Efeito de brilho mágico nos cards */
        .option-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 229, 255, 0.15), transparent);
            transition: 0.6s;
        }

        .option-card:hover::before {
            left: 100%;
        }

        .option-card:hover {
            background-color: var(--card-hover-bg);
            transform: translateY(-5px);
            border-color: var(--accent-cyan);
            box-shadow: 0 12px 30px rgba(0, 136, 255, 0.3), 0 0 15px rgba(0, 229, 255, 0.2);
        }

        .card-icon-wrapper {
            width: 70px;
            height: 70px;
            background: radial-gradient(circle, rgba(0, 136, 255, 0.2) 0%, rgba(11, 16, 33, 0.6) 100%);
            border: 1.5px solid var(--accent-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 0 15px rgba(226, 183, 85, 0.2);
            transition: transform 0.4s ease;
        }

        .option-card:hover .card-icon-wrapper {
            transform: rotate(15deg) scale(1.1);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.5);
        }

        .card-icon-wrapper i {
            font-size: 1.8rem;
            color: var(--accent-cyan);
            text-shadow: 0 0 8px var(--accent-blue);
        }

        .card-text {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .card-text h2 {
            font-family: 'Cinzel', serif;
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-color);
            letter-spacing: 0.5px;
            transition: color 0.3s ease;
        }

        .option-card:hover .card-text h2 {
            color: var(--accent-cyan);
        }

        .card-text p {
            font-size: 0.95rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* Detalhe místico de seta à direita */
        .card-arrow {
            margin-left: auto;
            color: var(--accent-gold);
            font-size: 1.1rem;
            opacity: 0.5;
            transition: all 0.3s ease;
        }

        .option-card:hover .card-arrow {
            opacity: 1;
            color: var(--accent-cyan);
            transform: translateX(5px);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Cabeçalho de Configurações com Seta de Voltar para perfil.html -->
        <div class="header-section">
            <a href="perfi.html" class="back-link" title="Voltar ao Perfil">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div class="header-title-wrapper">
                <!-- Ícone Místico do Olho Grego -->
                <div class="greek-eye-icon"></div>
                <h1>Portais & Registros</h1>
            </div>
        </div>

        <!-- Container 1: Integrantes (Link para integrantes.html) -->
        <a href="integrantes.html" class="option-card">
            <div class="card-icon-wrapper">
                <i class="fa-solid fa-users-rays"></i>
            </div>
            <div class="card-text">
                <h2>Círculo de Integrantes</h2>
                <p>Gerencie as almas conectadas a este oráculo</p>
            </div>
            <i class="fa-solid fa-chevron-right card-arrow"></i>
        </a>

        <!-- Container 2: Vídeos (Link para video.html) -->
        <a href="video.html" class="option-card">
            <div class="card-icon-wrapper">
                <i class="fa-solid fa-eye"></i>
            </div>
            <div class="card-text">
                <h2>Avisos & Visões em Vídeo</h2>
                <p>Contemple as projeções e registros místicos</p>
            </div>
            <i class="fa-solid fa-chevron-right card-arrow"></i>
        </a>
    </div>

</body>
</html>
